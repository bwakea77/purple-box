<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>Purple Box</title>
    <style>
      html, body { background: #000; color: #fff; margin: 0; padding: 0; }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Tiny pre-bundle ES5 check: the app bundle targets ES2020 syntax
      // (optional chaining, nullish coalescing), which throws a parse error
      // on older engines instead of failing gracefully. This inline, un-
      // transpiled script runs first and shows a plain message instead of
      // a blank page when the runtime can't handle it.
      (function () {
        function isSupported() {
          try {
            // eslint-disable-next-line no-new-func
            new Function('const x = {}; return x?.y ?? true;')();
          } catch (e) {
            return false;
          }
          return (
            typeof Promise !== 'undefined' &&
            typeof fetch !== 'undefined' &&
            typeof WebSocket !== 'undefined'
          );
        }
        if (!isSupported()) {
          document.documentElement.setAttribute('data-unsupported', 'true');
          var root = document.getElementById('root');
          root.innerHTML =
            '<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;' +
            'background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,' +
            'sans-serif;padding:24px;text-align:center;">' +
            '<div><h1 style="color:#8B5CF6;margin:0 0 12px;">Unsupported browser</h1>' +
            '<p style="margin:0;line-height:1.5;">Purple Box needs a newer browser to run securely. ' +
            'Please update Chrome, Safari, Firefox, or Samsung Internet to a recent version.</p></div></div>';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
