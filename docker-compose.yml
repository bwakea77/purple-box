services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  client:
    build:
      context: ./client
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  redis-data:
